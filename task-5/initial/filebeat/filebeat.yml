# откуда брать данные
filebeat.inputs:
  # «Смотри прямо в стандартный вывод (console logs) всех запущенных Docker-контейнеров»
  - type: docker
    combine_partial: true   # Если лог-сообщение слишком длинное и Docker разбил его на несколько частей, Filebeat склеит их обратно в одну строку перед отправкой.
    containers:
      path: "/usr/share/filebeat/dockerlogs/*/*.log"  # Это путь внутри контейнера Filebeat, где он ожидает увидеть файлы логов других контейнеров.
      stream: "stdout"                    # только стандартный вывод. Ошибки из stderr в данном случае игнорируются (хотя обычно лучше собирать оба) 
      ids:
        - "*"                             # «собирать логи со всех контейнеров», которые видны в указанной папке
    exclude_files: ['\.gz$']              # Если Docker сделал ротацию логов и сжал старые файлы в .gz, Filebeat не будет пытаться их прочитать
    ignore_older: 10m

# как их обработать
processors:
  # decode the log field (sub JSON document) if JSON encoded, then maps it's fields to elasticsearch fields
  - decode_json_fields:
      fields: ["log", "message", "msg"]
      target: ""
      # overwrite existing target elasticsearch fields while decoding json fields
      overwrite_keys: true
  - add_docker_metadata:
      # annotates each event with relevant metadata from Docker containers
      host: "unix:///var/run/docker.sock"
  - drop_fields:
      # drop the fields below in order to have a cleaner
      fields: ["container.labels.io_buildpacks_build_metadata", "container.labels.io_buildpacks_lifecycle_metadata", "container.labels.io_buildpacks_stack_id"]

filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# куда слать
output.logstash:
  hosts: ["logstash"]

# Write Filebeat own logs only to file to avoid catching them with itself in docker log files
logging.level: info
logging.to_files: false
logging.to_syslog: false
loggins.metrice.enabled: false
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
ssl.verification_mode: none
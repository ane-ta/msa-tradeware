spring.datasource.url=jdbc:postgresql://localhost:5432/productsdb
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.batch.jdbc.initialize-schema=always
spring.jpa.hibernate.ddl-auto=none
spring.batch.jdbc.table-prefix=BATCH_
batch.chunk.size=3


spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# Открываем эндпоинты мониторинга (по умолчанию они закрыты)
management.endpoints.web.exposure.include=prometheus,health,info
management.metrics.export.prometheus.enabled=true

# Порт приложения (по умолчанию 8080)
server.port=8080

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:schema-all.sql
spring.sql.init.data-locations=classpath:data-all.sql

# spring.profiles.active=non-json-logs

# 1. Даем имя приложению (оно подтянется в JSON лог)
spring.application.name=tradeware-batch

# 2. Включаем генерацию трейсов (1.0 = 100% запросов)
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=
spring.zipkin.enabled=false

# 3. Включаем автоматический проброс контекста в MDC
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]